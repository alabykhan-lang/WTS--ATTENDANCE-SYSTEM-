name: Validate Attendance System
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application
        run: |
          test -s index.html
          test -s styles.css
          test -s config.js
          test -s app.js
          test -s manifest.webmanifest
          test -s vercel.json
          node --check config.js
          node --check app.js
          grep -q 'WTS Attendance System' index.html
          grep -q 'attendance_admin_read_api' app.js
          grep -q 'attendance_admin_write_api' app.js
          grep -q 'staff_attendance_admin_read_api' app.js
          grep -q 'staff_attendance_admin_write_api' app.js
          if grep -RIn -E 'SUPABASE_SERVICE_ROLE_KEY|service_role_key|sb_secret_|x-wts-device-secret' . --exclude-dir=.git; then exit 1; fi
