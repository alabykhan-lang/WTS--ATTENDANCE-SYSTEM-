name: Validate Attendance System
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check application
        run: |
          test -s index.html
          test -s styles.css
          test -s config.js
          test -s app.js
          test -s identity-login.js
          test -s manifest.webmanifest
          test -s scanner.html
          test -s scanner.css
          test -s scanner.js
          test -s scanner-manifest.webmanifest
          test -s scanner-sw.js
          test -s vercel.json
          test -s package.json
          test -s package-lock.json
          test -s vendor.bundle.js
          test -s supabase/migrations/20260806143000_universal_attendance_organizer.sql
          test -s docs/ATTENDANCE-SYSTEM-ARCHITECTURE.md
          npm ci --ignore-scripts
          npm run check
          npm run build
          npm test
          node --check config.js
          node --check app.js
          node --check identity-login.js
          node --check scanner.js
          node --check scanner-sw.js
          grep -q 'Attendance System' index.html
          grep -q 'class="locked"' index.html
          grep -q 'data-view="reports"' index.html
          grep -q 'attendance_universal_admin_read_api' app.js
          grep -q 'attendance_universal_admin_write_api' app.js
          grep -q 'attendance_controls_admin_write_api' app.js
          grep -q 'attendance_universal_intake' supabase/functions/attendance-scan/index.ts
          grep -q 'school_identity_portal_login' identity-login.js
          grep -q 'school_identity_change_password' identity-login.js
          grep -q 'attendance-scan' scanner.js
          if grep -q 'diagnosticMode' scanner.html; then echo 'Scanner test mode must not be part of the operational UI'; exit 1; fi
          grep -q 'offline_sync' scanner.js
          if grep -q 'public-live.js' index.html; then echo 'Public live loader must not be used'; exit 1; fi
          if grep -RIn -E 'service_role_key|sb_secret_' . --exclude-dir=.git --exclude=validate.yml; then exit 1; fi
